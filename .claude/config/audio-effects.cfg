# AgentVibes Audio Effects Configuration
# Format: AGENT_NAME|SOX_EFFECTS|BACKGROUND_FILE|BACKGROUND_VOLUME
#
# SOX_EFFECTS: sox effect chain (leave empty for none)
#   - reverb <reverberance> <HF-damping> <room-scale>
#   - pitch <cents> (100 cents = 1 semitone)
#   - equalizer <freq> <width>q <gain-dB>
#   - gain <dB>
#   - compand <attack,decay> <soft-knee-dB:in-dB,out-dB>
#
# BACKGROUND_FILE: path to ambient audio (relative to .claude/audio/tracks/)
# BACKGROUND_VOLUME: 0.0-1.0 (0.20-0.40 recommended)
#
# Example: John|reverb 30 50 80|my-track.mp3|0.25

# --- THE MATRIX CORE ---
# NOTE: Background music DISABLED for agents - only System uses music

# Neo - The One (Focused, slight digital resonance)
Neo|compand 0.1,0.3 6:-70,-60,-20 reverb 20 40 60||0.0

# Agent Smith - The Virus (British, Lower Pitch, menacing)
Smith|pitch -50 reverb 30 50 80||0.0

# Tank - The Operator (Clean, "Radio" EQ)
Tank|equalizer 3000 1q +2 compand 0.1,0.2 6:-70,-60,-20||0.0

# Morpheus - The Mentor (Deep, wise, reverb for authority)
Morpheus|pitch -20 reverb 20 40 60||0.0

# Oracle - The Seer (Warm, motherly, mature, slight lower pitch)
Oracle|pitch -10 equalizer 200 1q +4 equalizer 3000 1q -2||0.0

# Trinity - The Hacker (Direct, intimate, compressed)
Trinity|compand 0.1,0.3 6:-70,-60,-20 equalizer 2000 1q +2||0.0

# -----------------------

# Architect - The Designer (Refined British, no music)
Architect|reverb 40 50 90 gain -2||0.0

# -----------------------

# BMAD Agents - NO background music (voice effects only)

# PM John - upbeat, driving energy
John|gain -1 equalizer 3000 1q +2||0.0

# Architect Winston - deep, authoritative
Winston|reverb 40 50 90 gain -2||0.0

# Developer Amelia - clean, precise
Amelia|compand 0.3,1 6:-70,-60,-20||0.0

# Business Analyst Mary - warm, analytical
Mary|equalizer 200 1q +3 equalizer 2500 1q -2||0.0

# Scrum Master Bob - refined, organized
Bob|reverb 30 40 70 compand 0.2,0.5 6:-70,-60,-20||0.0

# Test Architect Murat - crisp, analytical
Murat|equalizer 4000 1q +3 compand 0.1,0.3 6:-70,-60,-20||0.0

# UX Designer Sally - warm, empathetic
Sally|reverb 25 40 70 equalizer 300 1q +2||0.0

# Tech Writer Paige - clear, patient
Paige|compand 0.2,0.5 6:-70,-60,-20||0.0

# Frame Expert Saif - structured, detail-oriented
Saif|equalizer 2000 1q +2||0.0

# BMad Master - wise orchestrator
BMad Master|reverb 50 60 100 pitch -100||0.0

# Party mode room ambiance - used when multiple agents are talking
_party_mode|compand 0.3,1 6:-70,-60,-20|agent_vibes_dark_chill_step_loop.mp3|0.40

# Mainframe - Robotic utility (Amy voice, high speed ~200 WPM)
Mainframe|speed 1.3||0.0

# System - ONLY ONE WITH BACKGROUND MUSIC (Matrix announcements)
System|equalizer 2000 1q +3 compand 0.1,0.2 6:-70,-60,-20 reverb 10 40 20|agentvibes_soft_flamenco_loop.mp3|0.15

# Default (no agent specified) - also has music for system announcements
default||agent_vibes_dark_chill_step_loop.mp3|0.30
